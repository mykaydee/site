<style>
/* ===================== TOKENS ===================== */
:root{
  color-scheme: dark light;
  --red:#DA0F2A; --red-hi:#FF3B45; --red-bright:#FF3B45;

  --bg:#000; --bg-2:#0C0C0E;
  --card:rgba(255,255,255,.06); --card-2:rgba(255,255,255,.10); --card-solid:#151517;
  --text:#F5F5F7; --text-2:#A1A1A8; --line:rgba(255,255,255,.12);

  --glass:rgba(30,30,34,.55);
  --glass-edge:rgba(255,255,255,.20);
  --glass-hi:rgba(255,255,255,.30);
  --glass-lo:rgba(255,255,255,.06);
  --glass-shadow:0 14px 44px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);

  --r-xl:32px; --r-lg:24px; --r-md:18px; --r-sm:12px;
  --pad:clamp(18px,4.5vw,34px);
  --max:1140px;
  --spring:cubic-bezier(.32,.72,0,1);
  --bounce:cubic-bezier(.34,1.56,.64,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F2F2F5; --bg-2:#fff;
  --card:rgba(0,0,0,.045); --card-2:rgba(0,0,0,.08); --card-solid:#fff;
  --text:#1D1D1F; --text-2:#6E6E73; --line:rgba(0,0,0,.10);
  --glass:rgba(255,255,255,.62); --glass-edge:rgba(255,255,255,.85);
  --glass-hi:rgba(255,255,255,.95); --glass-lo:rgba(0,0,0,.04);
  --glass-shadow:0 14px 40px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.07);
  --red-bright:#C90A20;
}}
:root[data-theme="light"]{
  --bg:#F2F2F5; --bg-2:#fff;
  --card:rgba(0,0,0,.045); --card-2:rgba(0,0,0,.08); --card-solid:#fff;
  --text:#1D1D1F; --text-2:#6E6E73; --line:rgba(0,0,0,.10);
  --glass:rgba(255,255,255,.62); --glass-edge:rgba(255,255,255,.85);
  --glass-hi:rgba(255,255,255,.95); --glass-lo:rgba(0,0,0,.04);
  --glass-shadow:0 14px 40px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.07);
  --red-bright:#C90A20;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;
  line-height:1.47;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit;background:none;border:none}
:focus-visible{outline:3px solid var(--red-hi);outline-offset:3px;border-radius:8px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.03em;line-height:1.06}
h1{font-size:clamp(36px,6.4vw,64px)}
h2{font-size:clamp(26px,3.6vw,38px)}

p{margin:0 0 15px}
.sub{color:var(--text-2);font-size:16px}

.meta{color:var(--text-2);font-size:14px}

/* ===================== GLASS ===================== */
.glass{position:relative;background:var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(200%) brightness(1.06);
  backdrop-filter:blur(30px) saturate(200%) brightness(1.06);
  border:.5px solid var(--glass-edge);
  box-shadow:var(--glass-shadow), inset 0 1px 1px var(--glass-hi), inset 0 -1px 1px var(--glass-lo);}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,var(--glass-hi),transparent 38%,transparent 72%,var(--glass-lo));
  opacity:.55;-webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:.6px}
@media (prefers-reduced-transparency: reduce){
  .glass{background:var(--card-solid);backdrop-filter:none;-webkit-backdrop-filter:none}

}

/* ===================== NAV ===================== */
.topbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:80;display:flex;align-items:center;
  gap:6px;padding:7px 7px 7px 15px;border-radius:999px;width:min(calc(100% - 26px),var(--max))}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.02em}
.mark{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;
  background:linear-gradient(155deg,#FF5560,var(--red) 55%,#8A0718);
  box-shadow:0 2px 6px rgba(218,15,42,.45), inset 0 1px 0 rgba(255,255,255,.45)}
.tabs{display:flex;gap:2px;margin-left:auto}
.tabs a{padding:8px 16px;border-radius:999px;font-size:14.5px;font-weight:500;color:var(--text-2);
  transition:transform .4s var(--bounce),background .3s,color .2s}
.tabs a:hover{color:#fff;background:var(--red);transform:scale(1.09)}
.tabs a.on{color:#fff;background:var(--red);box-shadow:0 4px 14px rgba(218,15,42,.4)}
.circle-btn{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:var(--text-2);
  transition:transform .4s var(--bounce),background .3s,color .2s}
.circle-btn:hover{color:#fff;background:var(--red);transform:scale(1.12)}
.tabbar{display:none}
@media (max-width:820px){

  .topbar .tabs{display:none}
  .topbar .circle-btn{margin-left:auto}

  .tabbar.min{transform:translateX(-50%) translateY(150%);opacity:0}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 15px;border-radius:999px;
    font-size:10.5px;font-weight:500;color:var(--text-2);transition:transform .4s var(--bounce),background .3s,color .2s}

}

/* ===================== CONTROLS ===================== */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-size:15px;font-weight:600;

.btn.prominent{background:var(--red);color:#fff;border:.5px solid rgba(255,255,255,.24);

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}

.score{display:inline-flex;align-items:baseline;gap:2px;padding:9px 15px;border-radius:15px;background:var(--red);color:#fff;
  font-weight:700;letter-spacing:-.03em;border:.5px solid rgba(255,255,255,.26);
  box-shadow:0 4px 14px rgba(218,15,42,.42), inset 0 1px 0 rgba(255,255,255,.32);

.score b{font-size:22px;line-height:1}
.score i{font-style:normal;font-size:11px;font-weight:600;opacity:.75}
.score.lg{padding:14px 22px;border-radius:21px}.score.lg b{font-size:40px}.score.lg i{font-size:14px}
.score.sm{padding:5px 11px;border-radius:12px}.score.sm b{font-size:15px}.score.sm i{font-size:9px}
.score:hover,.card:hover .score,a:hover > .score{transform:scale(1.14);box-shadow:0 10px 26px rgba(218,15,42,.55)}

/* swipeable segmented control with sliding bubble */
.seg{position:relative;display:flex;gap:2px;padding:4px;border-radius:999px;overflow-x:auto;scrollbar-width:none;
  -ms-overflow-style:none;max-width:100%;touch-action:pan-x;cursor:grab;scroll-behavior:smooth}
.seg::-webkit-scrollbar{display:none}

.seg-thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--red);z-index:0;
  border:.5px solid rgba(255,255,255,.26);box-shadow:0 5px 16px rgba(218,15,42,.45), inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .55s var(--spring),width .55s var(--spring);will-change:transform,width}
.seg button{position:relative;z-index:1;padding:9px 18px;border-radius:999px;font-size:14.5px;font-weight:500;
  color:var(--text-2);white-space:nowrap;cursor:pointer;transition:color .3s,transform .4s var(--bounce)}
.seg button:hover{color:var(--text);transform:scale(1.06)}
.seg button[aria-pressed="true"]{color:#fff;font-weight:600}
.search{display:flex;align-items:center;gap:9px;padding:12px 18px;border-radius:999px;flex:1;min-width:220px}
.search input{width:100%;font-size:15px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:28px}

/* ===================== CAROUSEL ===================== */
.carousel{position:relative;margin-bottom:12px}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  -ms-overflow-style:none;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.track::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;scroll-snap-align:center;border-radius:var(--r-xl);overflow:hidden;
  min-height:clamp(340px,52vh,520px);display:flex;align-items:flex-end;background:var(--card-solid);
  cursor:pointer;text-align:left;width:100%;transition:transform .5s var(--spring)}
.slide-media{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 1.4s var(--spring)}
.slide:hover .slide-media{transform:scale(1.05)}
.slide-fallback{position:absolute;inset:0;background:radial-gradient(120% 95% at 12% 0%,#FF3B45,#B00A1F 40%,#39030A 74%,#080002)}
.slide-veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,.42) 46%,rgba(0,0,0,.08))}
.slide-card{position:relative;margin:clamp(14px,2.4vw,22px);padding:clamp(18px,2.8vw,28px);border-radius:var(--r-lg);

.slide-card h2,.slide-card h1{margin-bottom:10px}

.slide-row{display:flex;align-items:center;gap:15px;margin:16px 0 0;flex-wrap:wrap}
.cnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:999px;display:none;

.cnav:hover{background:var(--red);transform:translateY(-50%) scale(1.14)}

.dots{display:flex;justify-content:center;gap:7px;margin-top:14px}

.dots button:hover{background:var(--red);transform:scale(1.4)}
.dots button.on{width:24px;background:var(--red)}

section{padding:clamp(40px,5.6vw,68px) 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:24px}

.grid{display:grid;gap:clamp(16px,2.4vw,26px);grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{display:block;transition:transform .5s var(--spring)}
.card:hover{transform:translateY(-8px) scale(1.02)}
.poster{position:relative;aspect-ratio:2/3;border-radius:var(--r-md);overflow:hidden;background:var(--card);
  box-shadow:0 8px 26px rgba(0,0,0,.32);transition:box-shadow .5s var(--spring)}
.card:hover .poster{box-shadow:0 20px 48px rgba(0,0,0,.5)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.card h3{margin:13px 0 3px}

.list{background:var(--card);border-radius:var(--r-lg);overflow:hidden}
.list-row{display:grid;grid-template-columns:148px 1fr;gap:18px;padding:15px 20px;align-items:baseline;transition:background .3s}

.detail{display:grid;grid-template-columns:272px 1fr;gap:clamp(24px,4vw,52px);align-items:start}
@media(max-width:760px){.detail{grid-template-columns:1fr}.detail .poster{max-width:210px}}
.prose{max-width:66ch;font-size:17.5px;line-height:1.62}
.prose p{margin:0 0 18px}
.back{display:inline-flex;align-items:center;gap:5px;color:var(--red-bright);font-size:15px;font-weight:500;
  margin-bottom:24px;padding:7px 15px 7px 11px;border-radius:999px;transition:transform .4s var(--bounce),background .3s,color .2s}

.events{display:grid;gap:12px}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:15px 18px;border-radius:var(--r-lg);
  background:var(--card);width:100%;text-align:left;cursor:pointer;transition:transform .45s var(--spring),background .3s}
.ev:hover{background:var(--card-2);transform:translateY(-3px) scale(1.005)}
.datechip{width:62px;padding:9px 0;border-radius:var(--r-sm);text-align:center;background:var(--red);color:#fff;

.ev:hover .datechip{transform:scale(1.1)}

.pill{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--card-2);color:var(--text-2);
  font-size:12px;font-weight:600;margin-bottom:7px;transition:transform .4s var(--bounce),background .3s,color .2s}
.pill.hot{background:rgba(218,15,42,.16);color:var(--red-bright)}
.ev:hover .pill{background:var(--red);color:#fff;transform:scale(1.06)}

.f-row{display:flex;flex-wrap:wrap;gap:22px;justify-content:space-between;align-items:center}

/* ===================== EVENT SHEET ===================== */
.backdrop{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(18px);

<body>

<div class="topbar glass" id="topbar">
  <a class="brand" href="#/"><span class="mark">KD</span>KAYDEE.MY</a>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
  <button class="circle-btn" id="themeBtn" aria-label="Switch appearance"></button>
</div>
<nav class="tabbar glass" id="tabbar" aria-label="Sections"></nav>

<main id="app"></main>

<footer>
  <div class="wrap f-row">
    <div>
      <div class="brand" style="font-size:17px"><span class="mark">KD</span>Kaydee.my</div>
      <div class="meta" style="margin-top:10px">Indian cinema portal · Movies · Reviews · Events</div>
      <div class="meta" style="margin-top:4px">© <span id="yr"></span> Kaydee.my</div>
    </div>
    <div class="f-links" id="social"></div>
  </div>
</footer>

<div class="backdrop" id="sheet" hidden>
  <div class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheetInner"></div>
</div>

<script>
/* ===================== DATA ===================== */
const state = { reviews: [], events: [] };

async function loadData(){
  if(!CONFIG.API_URL){ state.reviews = SAMPLE.reviews; state.events = SAMPLE.events; return; }
  try{
    const res = await fetch(CONFIG.API_URL + "?route=all", { cache: "no-store" });
    const d = await res.json();
    const live = s => String(s || "published").toLowerCase() === "published";
    state.reviews = (d.reviews || []).filter(r => r.title && live(r.status));
    state.events  = (d.events  || []).filter(e => e.title && live(e.status));
  }catch(err){

  }
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const list = s => String(s ?? "").split(/[,|]/).map(x => x.trim()).filter(Boolean);
const num = s => { const n = parseFloat(s); return isNaN(n) ? null : n; };
const slugify = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const slugOf = r => slugify((r.title||"") + "-" + (r.year||""));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const parseDate = v => { if(!v) return null; const d = new Date(v); return isNaN(d) ? null : d; };
const fmtDate = v => { const d = parseDate(v); return d ? d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear() : esc(v||""); };
const runtime = m => { const n = num(m); return n ? Math.floor(n/60)+" hr "+(n%60)+" min" : ""; };
const dots = a => a.filter(Boolean).map(esc).join(" · ");
const isFeatured = x => ["true","yes","1","y"].includes(String(x.featured||"").trim().toLowerCase());
const upcoming = e => { const d = parseDate(e.date_end || e.date_start); return !d || d.getTime() >= Date.now() - 864e5; };
const byDate = k => (a,b) => (parseDate(a[k])?.getTime()||0) - (parseDate(b[k])?.getTime()||0);

/* ===================== CAROUSEL ===================== */
function carousel(slides, id){
  if(!slides.length) return "";
  return '<div class="carousel rise" data-carousel id="'+id+'">'+
    '<div class="track">'+slides.join("")+'</div>'+
    (slides.length > 1 ? '<button class="cnav prev glass" aria-label="Previous">'+ICON.left+'</button>'+
      '<button class="cnav next glass" aria-label="Next">'+ICON.right+'</button>'+
      '<div class="dots">'+slides.map((_,i) => '<button aria-label="Go to slide '+(i+1)+'"'+(i?"":' class="on"')+'></button>').join("")+'</div>' : "")+
    '</div>';
}
let TIMERS = [];
function initCarousels(){
  TIMERS.forEach(clearInterval); TIMERS = [];
  document.querySelectorAll("[data-carousel]").forEach(c => {
    const track = c.querySelector(".track"), dots = [...c.querySelectorAll(".dots button")];
    if(!track.children.length) return;
    const idx = () => Math.round(track.scrollLeft / track.clientWidth);
    const go = i => {
      const n = track.children.length;
      track.scrollTo({ left: ((i % n) + n) % n * track.clientWidth, behavior: "smooth" });
    };
    let timer, paused = false;
    const sync = () => dots.forEach((d,i) => d.classList.toggle("on", i === idx()));
    track.addEventListener("scroll", () => { clearTimeout(track._t); track._t = setTimeout(sync, 90); }, { passive:true });
    dots.forEach((d,i) => d.addEventListener("click", () => go(i)));
    c.querySelector(".prev")?.addEventListener("click", () => go(idx()-1));
    c.querySelector(".next")?.addEventListener("click", () => go(idx()+1));
    ["pointerenter","pointerdown","focusin"].forEach(ev => c.addEventListener(ev, () => paused = true));
    ["pointerleave","focusout"].forEach(ev => c.addEventListener(ev, () => paused = false));
    if(track.children.length > 1 && !matchMedia("(prefers-reduced-motion: reduce)").matches){
      timer = setInterval(() => { if(!paused) go(idx()+1); }, 6500);
      TIMERS.push(timer);
    }
  });
}

/* ===================== SWIPEABLE SEGMENTS ===================== */
function segmented(id, items, label){
  return '<div class="seg glass" id="'+id+'" role="group" aria-label="'+label+'"><span class="seg-thumb"></span>'+
    items.map(([v,l],i) => '<button data-v="'+esc(v)+'" aria-pressed="'+(i?"false":"true")+'">'+esc(l)+'</button>').join("")+'</div>';
}
function moveThumb(seg){
  const on = seg.querySelector('[aria-pressed="true"]'), thumb = seg.querySelector(".seg-thumb");
  if(!on || !thumb) return;
  thumb.style.width = on.offsetWidth + "px";
  thumb.style.transform = "translateX(" + on.offsetLeft + "px)";
  const l = on.offsetLeft - seg.scrollLeft, r = l + on.offsetWidth;
  if(l < 0 || r > seg.clientWidth) seg.scrollTo({ left: on.offsetLeft - (seg.clientWidth - on.offsetWidth)/2, behavior:"smooth" });
}
function dragScroll(el){
  let down = false, x0 = 0, s0 = 0, moved = 0;
  el.addEventListener("pointerdown", e => { down = true; moved = 0; x0 = e.clientX; s0 = el.scrollLeft; el.classList.add("dragging"); });
  el.addEventListener("pointermove", e => {
    if(!down) return;
    const dx = e.clientX - x0; moved = Math.max(moved, Math.abs(dx));
    if(moved > 4) el.scrollLeft = s0 - dx;
  });
  ["pointerup","pointercancel","pointerleave"].forEach(ev => el.addEventListener(ev, () => { down = false; el.classList.remove("dragging"); }));
  el.addEventListener("click", e => { if(moved > 6){ e.preventDefault(); e.stopPropagation(); } }, true);
}
function wireSegments(onChange){
  document.querySelectorAll(".seg").forEach(seg => {
    dragScroll(seg);
    requestAnimationFrame(() => moveThumb(seg));
    setTimeout(() => moveThumb(seg), 400);
    if(document.fonts) document.fonts.ready.then(() => moveThumb(seg));
    seg.addEventListener("click", e => {
      const b = e.target.closest("button"); if(!b) return;
      seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      moveThumb(seg); onChange && onChange();
    });
    seg.addEventListener("scroll", () => { clearTimeout(seg._t); seg._t = setTimeout(() => {
      const on = seg.querySelector('[aria-pressed="true"]'), thumb = seg.querySelector(".seg-thumb");
      if(on && thumb) thumb.style.transform = "translateX(" + on.offsetLeft + "px)";
    }, 40); }, { passive:true });
  });
}
addEventListener("resize", () => document.querySelectorAll(".seg").forEach(moveThumb));

let lastFocus = null;

  const e = state.events[i]; if(!e) return;

  const facts = [["When", [fmtDate(e.date_start) + (e.date_end && e.date_end !== e.date_start ? " – " + fmtDate(e.date_end) : ""), e.time].filter(Boolean).join(", ")],
    ["Where", [e.venue, e.city].filter(Boolean).join(", ")], ["Type", e.category], ["Price", e.price]].filter(([,v]) => v);
  document.getElementById("sheetInner").innerHTML =
    '<button class="sheet-close" id="sheetClose" aria-label="Close">'+ICON.close+'</button>'+
    '<div class="sheet-banner"'+(e.banner_url || e.poster_url ? ' style="background-image:url('+esc(e.banner_url || e.poster_url)+')"' : "")+'></div>'+
    '<div class="sheet-body">'+(e.category ? '<span class="pill hot">'+esc(e.category)+'</span>' : "")+
      '<h2 id="sheetTitle" style="font-size:clamp(23px,3.4vw,32px);margin:4px 0 0">'+esc(e.title)+'</h2>'+

      (e.description ? '<p class="prose" style="font-size:16.5px">'+esc(e.description)+'</p>' : "")+

    '</div>';
  const b = document.getElementById("sheet");
  b.hidden = false; document.body.classList.add("locked");
  requestAnimationFrame(() => b.classList.add("open"));
  document.getElementById("sheetClose").focus();
  document.getElementById("sheetClose").addEventListener("click", closeEvent);
}
function closeEvent(){
  const b = document.getElementById("sheet");
  b.classList.remove("open"); document.body.classList.remove("locked");
  setTimeout(() => { b.hidden = true; }, 340);
  lastFocus?.focus();
}
document.getElementById("sheet").addEventListener("click", e => { if(e.target.id === "sheet") closeEvent(); });
addEventListener("keydown", e => { if(e.key === "Escape" && !document.getElementById("sheet").hidden) closeEvent(); });
document.addEventListener("click", e => {
  const t = e.target.closest("[data-event]"); if(t) openEvent(Number(t.dataset.event));
});

const segValue = id => document.querySelector("#"+id+' [aria-pressed="true"]')?.dataset.v ?? "";
function applyFilters(){
  const q = (document.getElementById("q")?.value || "").toLowerCase().trim();
  const lang = segValue("lang"), sort = segValue("sort") || "new";
  let rows = state.reviews.filter(r =>
    (!q || [r.title,r.director,r.cast,r.genres,r.year].join(" ").toLowerCase().includes(q)) &&
    (!lang || r.language === lang));
  if(sort === "rating") rows.sort((a,b)=>(num(b.rating)||0)-(num(a.rating)||0));
  else if(sort === "az") rows.sort((a,b)=>String(a.title).localeCompare(String(b.title)));
  else rows.sort((a,b)=>(parseDate(b.review_date)?.getTime()||0)-(parseDate(a.review_date)?.getTime()||0));

function render(){
  const [, seg, param] = (location.hash.replace(/^#/,"") || "/").split("/");
  let html, key = "/" + (seg || "");
  if(!seg) html = pageHome();
  else if(seg === "reviews") html = pageReviews();
  else if(seg === "review") html = pageReview(param || "");
  else if(seg === "events") html = pageEvents();
  else if(seg === "about") html = pageAbout();
  else { html = notFound("That page doesn’t exist."); key = ""; }

  document.getElementById("app").innerHTML = html;
  document.querySelectorAll(".tabs a, .tabbar a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#"+key));
  document.title = "Kaydee.my — Indian Cinema Portal";
  scrollTo(0,0);
  if(seg === "reviews"){ applyFilters(); wireSegments(applyFilters); document.getElementById("q").addEventListener("input", applyFilters); }
  initCarousels();
}

let mode = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
function setTheme(m){
  document.documentElement.setAttribute("data-theme", m);
  document.documentElement.style.colorScheme = m;
  document.getElementById("themeBtn").innerHTML = m === "dark" ? ICON.sun : ICON.moon;
}
setTheme(mode);
document.getElementById("themeBtn").addEventListener("click", () => { mode = mode === "dark" ? "light" : "dark"; setTheme(mode); });

let lastY = 0;
addEventListener("scroll", () => {
  const bar = document.getElementById("tabbar"), y = scrollY;
  bar.classList.toggle("min", y > lastY && y > 180);
  lastY = y;
}, { passive:true });
addEventListener("hashchange", render);
