<html lang="en">
<head>

<meta property="og:description" content="Movies · Reviews · Entertainment updates">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
/* Site settings */
const CONFIG = {
  DATA_FILE: "data.json",
  INSTAGRAM: "https://www.instagram.com/kaydee.my/",
  TIKTOK: "https://www.tiktok.com/@kaydee.my",
  FACEBOOK: "https://www.facebook.com/Kaydee.my",
  EMAIL: "hello@kaydee.my",
  MAX_FEATURED: 5
};
</script>

<style>
/* ===================== TOKENS ===================== */
:root{
  color-scheme: dark light;
  --red:#F30219; --red-deep:#C9020D; --red-hi:#FF4A52; --red-bright:#FF4A52;
  --tint:rgba(243,2,25,.18); --tint-2:rgba(243,2,25,.28);

  --bg:#000; --bg-2:#0C0C0E;
  --card:rgba(255,255,255,.06); --card-2:rgba(255,255,255,.10); --card-solid:#151517;
  --text:#F5F5F7; --text-2:#A1A1A8; --line:rgba(255,255,255,.12);

  --glass:rgba(30,30,34,.55);
  --glass-edge:rgba(255,255,255,.20);
  --glass-hi:rgba(255,255,255,.30);
  --glass-lo:rgba(255,255,255,.06);
  --glass-shadow:0 14px 44px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);

  --r-xl:32px; --r-lg:24px; --r-md:18px; --r-sm:12px;
  --pad:clamp(18px,4.5vw,34px);
  --max:1140px;
  --spring:cubic-bezier(.32,.72,0,1);
  --bounce:cubic-bezier(.34,1.56,.64,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F2F2F5; --bg-2:#fff;
  --card:rgba(0,0,0,.045); --card-2:rgba(0,0,0,.08); --card-solid:#fff;
  --text:#1D1D1F; --text-2:#6E6E73; --line:rgba(0,0,0,.10);
  --glass:rgba(255,255,255,.62); --glass-edge:rgba(255,255,255,.85);
  --glass-hi:rgba(255,255,255,.95); --glass-lo:rgba(0,0,0,.04);
  --glass-shadow:0 14px 40px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.07);
  --red-bright:#C9020D; --tint:rgba(243,2,25,.10); --tint-2:rgba(243,2,25,.17);
}}
:root[data-theme="light"]{
  --bg:#F2F2F5; --bg-2:#fff;
  --card:rgba(0,0,0,.045); --card-2:rgba(0,0,0,.08); --card-solid:#fff;
  --text:#1D1D1F; --text-2:#6E6E73; --line:rgba(0,0,0,.10);
  --glass:rgba(255,255,255,.62); --glass-edge:rgba(255,255,255,.85);
  --glass-hi:rgba(255,255,255,.95); --glass-lo:rgba(0,0,0,.04);
  --glass-shadow:0 14px 40px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.07);
  --red-bright:#C9020D; --tint:rgba(243,2,25,.10); --tint-2:rgba(243,2,25,.17);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;
  line-height:1.47;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{position:fixed;width:100%;overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit;background:none;border:none}
:focus-visible{outline:3px solid var(--red-hi);outline-offset:3px;border-radius:8px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.03em;line-height:1.06}
h1{font-size:clamp(36px,6.4vw,64px)}
h2{font-size:clamp(26px,3.6vw,38px)}
h3{font-size:19px;letter-spacing:-.02em;line-height:1.25}
p{margin:0 0 15px}
.sub{color:var(--text-2);font-size:16px}
.eyebrow{font-size:13px;font-weight:600;color:var(--red-bright);margin:0 0 10px}
.meta{color:var(--text-2);font-size:14px}

/* ===================== GLASS ===================== */
.glass{position:relative;background:var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(200%) brightness(1.06);
  backdrop-filter:blur(30px) saturate(200%) brightness(1.06);
  border:.5px solid var(--glass-edge);
  box-shadow:var(--glass-shadow), inset 0 1px 1px var(--glass-hi), inset 0 -1px 1px var(--glass-lo);}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,var(--glass-hi),transparent 38%,transparent 72%,var(--glass-lo));
  opacity:.55;-webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:.6px}
@media (prefers-reduced-transparency: reduce){
  .glass{background:var(--card-solid);backdrop-filter:none;-webkit-backdrop-filter:none}
  .glass::after{display:none}
}

/* ===================== NAV ===================== */
.topbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:80;display:flex;align-items:center;
  gap:6px;padding:7px 7px 7px 15px;border-radius:999px;width:min(calc(100% - 26px),var(--max))}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.02em}
.mark{width:30px;height:30px;border-radius:50%;flex:none;
  background:url("logo.png") center/cover no-repeat,
             radial-gradient(circle at 32% 28%,#FF3742,var(--red) 55%,var(--red-deep));
  box-shadow:0 2px 8px rgba(243,2,25,.42)}
.brand:hover .mark{transform:scale(1.06)}
.mark,.brand .mark{transition:transform .4s var(--bounce)}
footer .mark{width:34px;height:34px}
.tabs{display:flex;gap:7px;margin-left:auto;margin-right:4px}
.tabs a{padding:7px 15px;border-radius:999px;font-size:14.5px;font-weight:500;color:var(--text-2);
  transition:background .32s var(--spring),color .22s}
.tabs a:hover{color:var(--text);background:var(--card)}
.tabs a.on{color:#fff;background:var(--red);font-weight:600;
  box-shadow:0 5px 16px rgba(243,2,25,.45), inset 0 1px 0 rgba(255,255,255,.3), inset 0 0 0 .5px rgba(255,255,255,.24)}
.tabs a.on:hover{background:var(--red-deep)}
.circle-btn{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:var(--text-2);
  transition:background .32s var(--spring),color .22s}
.circle-btn:hover{color:var(--text);background:var(--card)}
.tabbar{display:none}
@media (max-width:820px){
  .topbar{top:10px}
  .topbar .tabs{display:none}
  .topbar .circle-btn{margin-left:auto}
  .tabbar{display:flex;position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;z-index:80;
    transform:translateX(-50%);border-radius:999px;padding:7px;gap:6px;transition:transform .5s var(--spring),opacity .3s}
  .tabbar.min{transform:translateX(-50%) translateY(150%);opacity:0}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 14px;border-radius:999px;
    font-size:10.5px;font-weight:500;color:var(--text-2);transition:background .32s var(--spring),color .22s}
  .tabbar a:hover{color:var(--text);background:var(--card)}
  .tabbar a.on{color:#fff;background:var(--red);font-weight:600;
    box-shadow:0 5px 16px rgba(243,2,25,.45), inset 0 1px 0 rgba(255,255,255,.3), inset 0 0 0 .5px rgba(255,255,255,.24)}
}
@media (max-width:430px){
  .tabbar{padding:6px;gap:2px}
  .tabbar a{padding:7px 10px;font-size:10px;gap:2px}
}
main{padding-top:84px;min-height:60vh}
@media (max-width:820px){
  main{padding-top:78px}
  body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}  /* clears the floating tab bar */
}

/* ===================== CONTROLS ===================== */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-size:15px;font-weight:600;
  cursor:pointer;transition:transform .45s var(--bounce),background .3s,box-shadow .3s,color .2s;will-change:transform}
.btn.prominent{background:var(--red);color:#fff;border:.5px solid rgba(255,255,255,.24);
  box-shadow:0 6px 20px rgba(243,2,25,.42), inset 0 1px 0 rgba(255,255,255,.3)}
.btn.quiet{background:var(--card);color:var(--text)}
.btn:hover{background:var(--red-deep);color:#fff;transform:scale(1.08);box-shadow:0 10px 28px rgba(243,2,25,.5), inset 0 1px 0 rgba(255,255,255,.3)}
.btn:active{transform:scale(.95)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}

.score{display:inline-flex;align-items:baseline;gap:2px;padding:9px 15px;border-radius:15px;background:var(--red);color:#fff;
  font-weight:700;letter-spacing:-.03em;border:.5px solid rgba(255,255,255,.26);
  box-shadow:0 4px 14px rgba(243,2,25,.42), inset 0 1px 0 rgba(255,255,255,.32);
  transition:transform .45s var(--bounce),box-shadow .3s}
.score b{font-size:22px;line-height:1}
.score i{font-style:normal;font-size:11px;font-weight:600;opacity:.75}
.score.lg{padding:14px 22px;border-radius:21px}.score.lg b{font-size:40px}.score.lg i{font-size:14px}
.score.sm{padding:5px 11px;border-radius:12px}.score.sm b{font-size:15px}.score.sm i{font-size:9px}
.score:hover,.card:hover .score,a:hover > .score{transform:scale(1.14);box-shadow:0 10px 26px rgba(243,2,25,.55)}

/* swipeable segmented control with sliding bubble */
.seg{position:relative;display:flex;gap:2px;padding:4px;border-radius:999px;overflow-x:auto;scrollbar-width:none;
  -ms-overflow-style:none;max-width:100%;cursor:grab;scroll-behavior:smooth}
.seg::-webkit-scrollbar{display:none}
.seg.dragging{cursor:grabbing;scroll-behavior:auto}
.seg-thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--red);z-index:0;
  border:.5px solid rgba(255,255,255,.26);box-shadow:0 5px 16px rgba(243,2,25,.45), inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .55s var(--spring),width .55s var(--spring);will-change:transform,width}
.seg button{position:relative;z-index:1;padding:9px 18px;border-radius:999px;font-size:14.5px;font-weight:500;
  color:var(--text-2);white-space:nowrap;cursor:pointer;transition:color .3s,transform .4s var(--bounce)}
.seg button:hover{color:var(--text);transform:scale(1.06)}
.seg button[aria-pressed="true"]{color:#fff;font-weight:600}
.search{display:flex;align-items:center;gap:9px;padding:12px 18px;border-radius:999px;flex:1;min-width:220px}
.search input{width:100%;font-size:16px;-webkit-appearance:none;appearance:none;border-radius:0}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search input::placeholder{color:var(--text-2)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:28px}

/* ===================== CAROUSEL ===================== */
.carousel{position:relative;margin-bottom:12px}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  -ms-overflow-style:none;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.track::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;scroll-snap-align:center;border-radius:var(--r-xl);overflow:hidden;
  min-height:clamp(340px,52vh,520px);display:flex;align-items:flex-end;background:var(--card-solid);
  cursor:pointer;text-align:left;width:100%;transition:transform .5s var(--spring)}
.slide-media{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 1.4s var(--spring)}
.slide:hover .slide-media{transform:scale(1.05)}
.slide-fallback{position:absolute;inset:0;background:radial-gradient(120% 95% at 12% 0%,#F30219,#C9020D 40%,#3A0206 74%,#080002)}
.slide-veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,.42) 46%,rgba(0,0,0,.08))}
.slide-card{position:relative;margin:clamp(14px,2.4vw,22px);padding:clamp(18px,2.8vw,28px);border-radius:var(--r-lg);
  width:min(100%,580px);color:#F5F5F7}
.slide-card h2,.slide-card h1{margin-bottom:10px}
.slide-card .meta{color:rgba(245,245,247,.78)}
.slide-row{display:flex;align-items:center;gap:15px;margin:16px 0 0;flex-wrap:wrap}
.cnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:999px;display:none;
  place-items:center;cursor:pointer;z-index:3;color:#fff;transition:transform .45s var(--bounce),background .3s}
.cnav:hover{background:var(--red);transform:translateY(-50%) scale(1.14)}
.cnav.prev{left:14px}.cnav.next{right:14px}
@media(hover:hover) and (min-width:821px){.cnav{display:grid}}
.dots{display:flex;justify-content:center;gap:7px;margin-top:14px}
.dots button{position:relative;width:7px;height:7px;border-radius:999px;background:var(--card-2);cursor:pointer;
  transition:width .45s var(--spring),background .3s,transform .4s var(--bounce)}
.dots button::after{content:"";position:absolute;inset:-18px -9px}
.dots button:hover{background:var(--red);transform:scale(1.4)}
.dots button.on{width:24px;background:var(--red)}

/* ===================== CONTENT ===================== */
section{padding:clamp(40px,5.6vw,68px) 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:24px}
.sec-head a{font-size:15px;font-weight:500;color:var(--red-bright);padding:6px 14px;border-radius:999px;
  transition:transform .4s var(--bounce),background .3s,color .2s;white-space:nowrap}
.sec-head a:hover{background:var(--card);transform:scale(1.05)}
.grid{display:grid;gap:clamp(16px,2.4vw,26px);grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{display:block;transition:transform .5s var(--spring)}
.card:hover{transform:translateY(-8px) scale(1.02)}
.poster{position:relative;aspect-ratio:2/3;border-radius:var(--r-md);overflow:hidden;background:var(--card);
  box-shadow:0 8px 26px rgba(0,0,0,.32);transition:box-shadow .5s var(--spring)}
.card:hover .poster{box-shadow:0 20px 48px rgba(0,0,0,.5)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:700;letter-spacing:-.04em;
  color:rgba(255,255,255,.16);background:linear-gradient(150deg,#2A1418,#120609)}
.poster .score{position:absolute;left:10px;bottom:10px}
.card h3{margin:13px 0 3px}
.card .meta{font-size:13.5px}

.list{background:var(--card);border-radius:var(--r-lg);overflow:hidden}
.list-row{display:grid;grid-template-columns:148px 1fr;gap:18px;padding:15px 20px;align-items:baseline;transition:background .3s}
.list-row + .list-row{box-shadow:inset 0 .5px 0 var(--line)}
.list-row:hover{background:var(--card-2)}
.list-row dt{color:var(--text-2);font-size:14.5px}
.list-row dd{margin:0;font-size:16px}
@media(max-width:540px){.list-row{grid-template-columns:1fr;gap:2px}}

.detail{display:grid;grid-template-columns:272px 1fr;gap:clamp(24px,4vw,52px);align-items:start}
@media(max-width:760px){.detail{grid-template-columns:1fr}.detail .poster{max-width:210px}}
.prose{max-width:66ch;font-size:17.5px;line-height:1.62}
.prose p{margin:0 0 18px}
.back{display:inline-flex;align-items:center;gap:5px;color:var(--red-bright);font-size:15px;font-weight:500;
  margin-bottom:24px;padding:7px 15px 7px 11px;border-radius:999px;transition:transform .4s var(--bounce),background .3s,color .2s}
.back:hover{background:var(--red);color:#fff;transform:scale(1.06)}

.events{display:grid;gap:12px}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:15px 18px;border-radius:var(--r-lg);
  background:var(--card);width:100%;text-align:left;cursor:pointer;transition:transform .45s var(--spring),background .3s}
.ev:hover{background:var(--card-2);transform:translateY(-3px) scale(1.005)}
.datechip{width:60px;height:60px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border-radius:15px;background:var(--red);color:#fff;font-variant-numeric:tabular-nums lining-nums;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 12px rgba(243,2,25,.28);transition:transform .45s var(--bounce)}
.ev:hover .datechip{transform:scale(1.08)}
.datechip b{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1}
.datechip span{font-size:10.5px;font-weight:600;letter-spacing:.06em;line-height:1;opacity:.92}
.ev .thumb{width:46px;height:60px;flex:none;border-radius:11px;overflow:hidden;background:var(--card-2);
  display:grid;place-items:center;color:var(--red-bright);transition:transform .45s var(--bounce)}
.ev .thumb img{width:100%;height:100%;object-fit:cover}
.ev:hover .thumb{transform:scale(1.06)}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--card-2);color:var(--text-2);
  font-size:12px;font-weight:600;margin-bottom:7px;transition:transform .4s var(--bounce),background .3s,color .2s}
.pill.hot{background:rgba(243,2,25,.16);color:var(--red-bright)}
.ev:hover .pill{background:var(--red);color:#fff;transform:scale(1.06)}
.chev{color:var(--text-2);transition:transform .45s var(--bounce),color .3s}
.ev:hover .chev{color:var(--red-bright);transform:translateX(4px) scale(1.2)}
@media(max-width:620px){.ev{grid-template-columns:auto 1fr}.ev .chev{display:none}}

.board{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(146px,1fr))}
.tier{padding:20px;border-radius:var(--r-md);background:var(--card);cursor:default;
  transition:transform .45s var(--bounce),background .3s,box-shadow .3s,color .2s}
.tier b{display:block;font-size:30px;font-weight:700;letter-spacing:-.04em}
.tier span{color:var(--text-2);font-size:14px;transition:color .2s}
.tier.top{background:var(--red);color:#fff}.tier.top span{color:rgba(255,255,255,.85)}
.tier:hover{background:var(--red);color:#fff;transform:scale(1.06);box-shadow:0 12px 30px rgba(243,2,25,.42)}
.tier:hover span{color:rgba(255,255,255,.85)}

.badge{display:inline-flex;align-items:center;padding:9px 15px;border-radius:14px;background:var(--tint);
  color:var(--red-bright);border:.5px solid var(--tint-2);font-weight:600;font-size:13.5px;letter-spacing:-.01em;
  transition:transform .45s var(--bounce)}
.badge.lg{padding:13px 20px;border-radius:19px;font-size:16px}
.badge.sm{padding:5px 11px;border-radius:12px;font-size:11px;background:rgba(0,0,0,.5);color:#fff;border-color:rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.card:hover .badge,.badge:hover{transform:scale(1.08)}
.poster .badge{position:absolute;left:10px;bottom:10px}

/* ===================== CALENDAR ===================== */
.cal-wrap{display:grid;gap:clamp(24px,4vw,36px);align-items:start}
@media (min-width:900px){.cal-wrap{grid-template-columns:minmax(0,430px) 1fr}}
.cal{background:var(--card);border-radius:var(--r-lg);padding:clamp(10px,3vw,18px);touch-action:pan-y;
  -webkit-user-select:none;user-select:none;overflow:hidden}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;padding:0 2px}
.cal-top h3{font-size:clamp(17px,4.6vw,20px)}
.cal-nav button{flex:none}
@media (max-width:380px){.cal-nav button.today{padding:0 11px;font-size:12.5px}}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-nav button{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;cursor:pointer;
  color:var(--text-2);background:var(--card-2);transition:transform .4s var(--bounce),background .3s,color .2s}
.cal-nav button.today{width:auto;padding:0 15px;font-size:13.5px;font-weight:600}
.cal-nav button:hover{background:var(--red);color:#fff;transform:scale(1.1)}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(2px,.8vw,6px)}
.cal-dow{margin-bottom:6px}
.cal-dow span{text-align:center;font-size:clamp(10px,2.9vw,11.5px);font-weight:600;color:var(--text-2)}
.cal-grid{animation:calIn .38s var(--spring)}
.cal-grid.back{animation:calBack .38s var(--spring)}
@keyframes calIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes calBack{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.cal-cell{aspect-ratio:1;min-width:0;border-radius:clamp(9px,2.8vw,13px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(2px,.9vw,4px);font-size:clamp(13px,3.7vw,15px);font-weight:500;
  color:var(--text);font-variant-numeric:tabular-nums lining-nums;padding:0;
  transition:background .3s,transform .4s var(--bounce),color .2s}
.cal-cell.empty{visibility:hidden}
.cal-cell.none{color:var(--text-2);opacity:.45}
.cal-cell.has{cursor:pointer;background:var(--card-2)}
.cal-cell.has:hover{background:var(--tint);color:var(--red-bright);transform:scale(1.08)}
.cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--red);color:var(--red-bright);font-weight:700}
.cal-cell.on{background:var(--red);color:#fff;transform:scale(1.06);box-shadow:0 6px 18px rgba(243,2,25,.4)}
.marks{display:flex;gap:clamp(2px,.7vw,3px);height:clamp(4px,1.4vw,5px);align-items:center}
.marks i{width:clamp(4px,1.3vw,5px);height:clamp(4px,1.3vw,5px);border-radius:50%;background:var(--red);flex:none}
.marks i.evt{background:var(--text-2)}
.cal-cell.on .marks i{background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;padding:0 2px;font-size:clamp(12px,3.2vw,13px);color:var(--text-2)}
.legend i{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block;margin-right:7px;vertical-align:middle}
.legend i.evt{background:var(--text-2)}

.empty{padding:50px 24px;border-radius:var(--r-lg);background:var(--card);text-align:center;color:var(--text-2)}
footer{padding:44px 0;margin-top:20px;box-shadow:inset 0 .5px 0 var(--line)}
@media (max-width:820px){footer{padding:34px 0 10px}}
.f-row{display:flex;flex-wrap:wrap;gap:22px;justify-content:space-between;align-items:center}
@media (max-width:600px){
  .f-row{flex-direction:column;align-items:center;text-align:center;gap:20px}
  /* only the text column stacks — the icon row must stay a row */
  .f-row > div:not(.f-links){display:flex;flex-direction:column;align-items:center}
  .f-links{flex-direction:row;justify-content:center}
}
.f-links{display:flex;flex-direction:row;gap:10px;flex-wrap:nowrap}
.f-links a{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;flex:none;
  background:var(--card);color:var(--text-2);
  transition:transform .4s var(--bounce),background .3s,color .2s}
.f-links a:hover{background:var(--red);color:#fff;transform:scale(1.12)}
.f-links a:active{transform:scale(.94)}

/* ===================== EVENT SHEET ===================== */
.backdrop{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .35s}
.grabber{display:none;width:38px;height:5px;border-radius:999px;background:var(--line);margin:9px auto 0}
.sheet-back{position:absolute;top:14px;left:14px;width:34px;height:34px;border-radius:999px;display:grid;place-items:center;
  cursor:pointer;color:#fff;background:rgba(0,0,0,.42);z-index:2;transition:transform .45s var(--bounce),background .3s}
.sheet-back:hover{background:var(--red);transform:scale(1.14)}
@media (max-width:640px){
  .backdrop{place-items:end center;padding:0}
  .sheet{width:100%;max-height:88vh;border-radius:26px 26px 0 0;transform:translateY(100%) scale(1);
    padding-bottom:env(safe-area-inset-bottom)}
  .grabber{display:block}
  .sheet-close,.sheet-back{top:10px}
}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{width:min(560px,100%);max-height:88vh;overflow-y:auto;border-radius:var(--r-xl);
  transform:translateY(28px) scale(.96);transition:transform .55s var(--spring)}
.backdrop.open .sheet{transform:none}
.sheet-banner{aspect-ratio:16/9;background-size:cover;background-position:center;
  background-image:radial-gradient(115% 120% at 78% 0%,#F30219,#C9020D 46%,#180104)}
.sheet-body{padding:clamp(20px,3.4vw,28px)}
.sheet-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:999px;display:grid;place-items:center;
  cursor:pointer;color:#fff;background:rgba(0,0,0,.42);z-index:2;transition:transform .45s var(--bounce),background .3s}
.sheet-close:hover{background:var(--red);transform:scale(1.14)}
.sheet .list{margin:18px 0}

.rise{opacity:0;transform:translateY(16px);animation:rise .7s var(--spring) forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  .rise{opacity:1;transform:none}
  .track{scroll-behavior:auto}
}

<script>
/* ===================== DATA =====================
   Content is baked into data.json when the site is published, so a visit is a
   single static file read. No live lookups, nothing to expire, nothing to clear.
   ================================================ */
const state = { reviews: [], events: [] };

async function loadData(){
  try{
    const res = await fetch(CONFIG.DATA_FILE, { cache: "no-cache" });
    if(!res.ok) throw 0;
    const d = await res.json();
    state.reviews = Array.isArray(d.reviews) ? d.reviews : [];
    state.events  = Array.isArray(d.events)  ? d.events  : [];
    if(!state.reviews.length && !state.events.length) throw 0;
  }catch(err){
    state.reviews = SAMPLE.reviews;   // local preview before the first publish
    state.events  = SAMPLE.events;
  }
}

/* ===================== HELPERS ===================== */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const list = s => String(s ?? "").split(/[,|]/).map(x => x.trim()).filter(Boolean);
const num = s => { const n = parseFloat(s); return isNaN(n) ? null : n; };
const slugify = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const slugOf = r => slugify((r.title||"") + "-" + (r.year||""));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const parseDate = v => {
  if(!v) return null;
  const iso = String(v).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
  const d = iso ? new Date(+iso[1], +iso[2] - 1, +iso[3]) : new Date(v);
  return isNaN(d) ? null : d;
};
const fmtDate = v => { const d = parseDate(v); return d ? d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear() : esc(v||""); };
const runtime = m => { const n = num(m); return n ? Math.floor(n/60)+" hr "+(n%60)+" min" : ""; };
const dots = a => a.filter(Boolean).map(esc).join(" · ");
const bg = u => 'url("' + esc(String(u).replace(/"/g, "%22")) + '")';   // safe inside a style attribute
const isFeatured = x => ["true","yes","1","y"].includes(String(x.featured||"").trim().toLowerCase());
const upcoming = e => { const d = parseDate(e.date_end || e.date_start); return !d || d.getTime() >= Date.now() - 864e5; };
const byDate = k => (a,b) => (parseDate(a[k])?.getTime()||0) - (parseDate(b[k])?.getTime()||0);
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
/* A film with a release date still ahead of us is upcoming; it becomes a normal
   review the moment a rating is filled in. */
const unreleased = r => { const d = parseDate(r.release_date); return !!d && d.getTime() > today0(); };
const rated = r => num(r.rating) !== null;
const dayKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");

const ICON = {
  home:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.4 12 3l9 7.4V20a1 1 0 0 1-1 1h-5v-6.5h-6V21H4a1 1 0 0 1-1-1z"/></svg>',
  star:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3.6 2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.9l6-.8z"/></svg>',
  cal:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.2" y="5" width="17.6" height="16" rx="4"/><path d="M8 3v4M16 3v4M3.2 10.5h17.6"/></svg>',
  info:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.2"/><path d="M12 11v5.4M12 7.7v.2"/></svg>',
  search:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>',
  sun:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.2M12 19.4v2.2M2.4 12h2.2M19.4 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>',
  moon:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.2A8.4 8.4 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></svg>',
  left:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5-7 7 7 7"/></svg>',
  right:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 5 7 7-7 7"/></svg>',
  close:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  ticket:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 9.2V7a1.5 1.5 0 0 1 1.5-1.5h14A1.5 1.5 0 0 1 20.5 7v2.2a2.8 2.8 0 0 0 0 5.6V17a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 17v-2.2a2.8 2.8 0 0 0 0-5.6z"/><path d="M14 6v12" stroke-dasharray="2 2.6"/></svg>',
  calgrid:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.2" y="5" width="17.6" height="16" rx="4"/><path d="M8 3v4M16 3v4M3.2 10.5h17.6"/><circle cx="8.4" cy="14.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="14.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="15.6" cy="14.6" r="1.15" fill="currentColor" stroke="none"/></svg>',
  play:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.87l10.4-6.4a1 1 0 0 0 0-1.74L9.5 4.73A1 1 0 0 0 8 5.6z"/></svg>',
  instagram:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5.2"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.1" cy="6.9" r="1.15" fill="currentColor" stroke="none"/></svg>',
  tiktok:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 3h-2.7v11.4a2.3 2.3 0 1 1-2.3-2.3c.24 0 .47.04.69.11V9.4a5.2 5.2 0 0 0-.69-.05 5.05 5.05 0 1 0 5.05 5.05V8.9a6.4 6.4 0 0 0 3.75 1.2V7.4A3.75 3.75 0 0 1 16.4 3z"/></svg>',
  facebook:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13.6 21v-8.2h2.75l.41-3.19H13.6V7.57c0-.92.26-1.55 1.58-1.55h1.69V3.17c-.29-.04-1.3-.13-2.47-.13-2.44 0-4.11 1.49-4.11 4.23v2.34H7.53v3.19h2.76V21z"/></svg>',
  mail:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="2.8" y="5" width="18.4" height="14" rx="3.4"/><path d="m3.6 7.6 7.35 5.05a1.85 1.85 0 0 0 2.1 0L20.4 7.6"/></svg>'
};
const NAV = [["/","Home","home"],["/movies","Movies","star"],["/events","Events","ticket"],
             ["/calendar","Calendar","calgrid"],["/about","About","info"]];
const MONTH = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function score(v, size){
  const n = num(v); if(n === null) return "";
  return '<span class="score '+(size||"")+'"><b>'+(Number.isInteger(n)?n:n.toFixed(1))+'</b><i>/10</i></span>';
}
/* Either a score or an Upcoming badge, never both. */
function mark(r, size){
  if(rated(r)) return score(r.rating, size);
  if(unreleased(r)) return '<span class="badge '+(size||"")+'">Upcoming</span>';
  return "";
}
function poster(r, withScore){
  const ph = '<div class="ph">'+esc((r.title||"KD").slice(0,2).toUpperCase())+'</div>';
  const img = r.poster_url ? '<img src="'+esc(r.poster_url)+'" alt="'+esc(r.title)+'" loading="lazy" onerror="this.remove()">' : "";
  return '<div class="poster">'+ph+img+(withScore ? mark(r,"sm") : "")+'</div>';
}
function card(r){
  const line = unreleased(r)
    ? '<span style="color:var(--red-bright)">In cinemas ' + fmtDate(r.release_date) + '</span>'
    : dots([r.year, r.language, runtime(r.runtime_min)]);
  return '<a class="card" href="#/review/'+slugOf(r)+'">'+poster(r,true)+
    '<h3>'+esc(r.title)+'</h3><div class="meta">'+line+'</div></a>';
}
function media(url){
  return url ? '<div class="slide-media" style="background-image:'+bg(url)+'"></div>' : '<div class="slide-fallback"></div>';
}

/* ===================== CAROUSEL ===================== */
function carousel(slides, id){
  if(!slides.length) return "";
  return '<div class="carousel rise" data-carousel id="'+id+'">'+
    '<div class="track">'+slides.join("")+'</div>'+
    (slides.length > 1 ? '<button class="cnav prev glass" aria-label="Previous">'+ICON.left+'</button>'+
      '<button class="cnav next glass" aria-label="Next">'+ICON.right+'</button>'+
      '<div class="dots">'+slides.map((_,i) => '<button aria-label="Go to slide '+(i+1)+'"'+(i?"":' class="on"')+'></button>').join("")+'</div>' : "")+
    '</div>';
}
let TIMERS = [];
function initCarousels(){
  TIMERS.forEach(clearInterval); TIMERS = [];
  document.querySelectorAll("[data-carousel]").forEach(c => {
    const track = c.querySelector(".track"), dots = [...c.querySelectorAll(".dots button")];
    if(!track.children.length) return;
    const at = i => track.children[i].offsetLeft - track.children[0].offsetLeft;
    const idx = () => {
      let best = 0, min = Infinity;
      for(let i = 0; i < track.children.length; i++){
        const d = Math.abs(at(i) - track.scrollLeft);
        if(d < min){ min = d; best = i; }
      }
      return best;
    };
    const go = i => {
      const n = track.children.length;
      track.scrollTo({ left: at(((i % n) + n) % n), behavior: "smooth" });
    };
    let timer, paused = false;
    const sync = () => dots.forEach((d,i) => d.classList.toggle("on", i === idx()));
    track.addEventListener("scroll", () => { clearTimeout(track._t); track._t = setTimeout(sync, 90); }, { passive:true });
    dots.forEach((d,i) => d.addEventListener("click", () => go(i)));
    c.querySelector(".prev")?.addEventListener("click", () => go(idx()-1));
    c.querySelector(".next")?.addEventListener("click", () => go(idx()+1));
    let resume;
    const hold = () => { paused = true; clearTimeout(resume); resume = setTimeout(() => paused = false, 9000); };
    ["pointerenter","pointerdown","focusin","touchstart"].forEach(ev => c.addEventListener(ev, hold, { passive:true }));
    ["pointerleave","focusout"].forEach(ev => c.addEventListener(ev, () => { clearTimeout(resume); paused = false; }));
    if(track.children.length > 1 && !matchMedia("(prefers-reduced-motion: reduce)").matches){
      timer = setInterval(() => { if(!paused) go(idx()+1); }, 6500);
      TIMERS.push(timer);
    }
  });
}

/* ===================== SWIPEABLE SEGMENTS ===================== */
function segmented(id, items, label){
  return '<div class="seg glass" id="'+id+'" role="group" aria-label="'+label+'"><span class="seg-thumb"></span>'+
    items.map(([v,l],i) => '<button data-v="'+esc(v)+'" aria-pressed="'+(i?"false":"true")+'">'+esc(l)+'</button>').join("")+'</div>';
}
function moveThumb(seg){
  const on = seg.querySelector('[aria-pressed="true"]'), thumb = seg.querySelector(".seg-thumb");
  if(!on || !thumb) return;
  thumb.style.width = on.offsetWidth + "px";
  thumb.style.transform = "translateX(" + on.offsetLeft + "px)";
  const l = on.offsetLeft - seg.scrollLeft, r = l + on.offsetWidth;
  if(l < 0 || r > seg.clientWidth) seg.scrollTo({ left: on.offsetLeft - (seg.clientWidth - on.offsetWidth)/2, behavior:"smooth" });
}
function dragScroll(el){
  let down = false, x0 = 0, s0 = 0, moved = 0;
  el.addEventListener("pointerdown", e => { down = true; moved = 0; x0 = e.clientX; s0 = el.scrollLeft; el.classList.add("dragging"); });
  el.addEventListener("pointermove", e => {
    if(!down) return;
    const dx = e.clientX - x0; moved = Math.max(moved, Math.abs(dx));
    if(moved > 4) el.scrollLeft = s0 - dx;
  });
  ["pointerup","pointercancel","pointerleave"].forEach(ev => el.addEventListener(ev, () => { down = false; el.classList.remove("dragging"); }));
  el.addEventListener("click", e => { if(moved > 6){ e.preventDefault(); e.stopPropagation(); } }, true);
}
function wireSegments(onChange){
  document.querySelectorAll(".seg").forEach(seg => {
    dragScroll(seg);
    requestAnimationFrame(() => moveThumb(seg));
    setTimeout(() => moveThumb(seg), 400);
    if(document.fonts) document.fonts.ready.then(() => moveThumb(seg));
    seg.addEventListener("click", e => {
      const b = e.target.closest("button"); if(!b) return;
      seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      moveThumb(seg); onChange && onChange();
    });
    seg.addEventListener("scroll", () => { clearTimeout(seg._t); seg._t = setTimeout(() => {
      const on = seg.querySelector('[aria-pressed="true"]'), thumb = seg.querySelector(".seg-thumb");
      if(on && thumb) thumb.style.transform = "translateX(" + on.offsetLeft + "px)";
    }, 40); }, { passive:true });
  });
}
addEventListener("resize", () => document.querySelectorAll(".seg").forEach(moveThumb));

/* ===================== EVENT SHEET ===================== */
let lastFocus = null, sheetBack = null, calSwipe = "";

const SHEET_CHROME = dayBack =>
  '<div class="grabber"></div>' +
  (dayBack ? '<button class="sheet-back" data-day-back aria-label="Back to the day">'+ICON.left+'</button>' : "") +
  '<button class="sheet-close" id="sheetClose" aria-label="Close">'+ICON.close+'</button>';

function sheetOpen(html){
  const b = document.getElementById("sheet"), inner = document.getElementById("sheetInner");
  if(b.hidden) lastFocus = document.activeElement;
  inner.innerHTML = html;
  inner.scrollTop = 0;
  if(b.hidden){
    b.hidden = false;
    lockScroll(true);
    requestAnimationFrame(() => b.classList.add("open"));
  }
  const x = document.getElementById("sheetClose");
  if(x){ x.addEventListener("click", closeEvent); x.focus(); }
}

function openEvent(i){
  const e = state.events[i]; if(!e) return;
  const span = fmtDate(e.date_start) + (e.date_end && e.date_end !== e.date_start ? " – " + fmtDate(e.date_end) : "");
  const facts = [["When", [span, e.time].filter(Boolean).join(", ")],
    ["Where", [e.venue, e.city].filter(Boolean).join(", ")], ["Type", e.category], ["Price", e.price]].filter(([,v]) => v);
  sheetOpen(SHEET_CHROME(sheetBack) +
    '<div class="sheet-banner"'+(e.banner_url || e.poster_url ? ' style="background-image:'+bg(e.banner_url || e.poster_url)+'"' : "")+'></div>'+
    '<div class="sheet-body">'+(e.category ? '<span class="pill hot">'+esc(e.category)+'</span>' : "")+
      '<h2 id="sheetTitle" style="font-size:clamp(23px,3.4vw,32px);margin:4px 0 0">'+esc(e.title)+'</h2>'+
      '<dl class="list">'+facts.map(([k,v]) => '<div class="list-row"><dt>'+k+'</dt><dd>'+esc(v)+'</dd></div>').join("")+'</dl>'+

/* A tapped date opens the same sheet, listing everything on that day. */
function openDay(key){
  const items = calendarMap()[key] || [];
  const d = parseDate(key);
  sheetBack = null;
  sheetOpen(SHEET_CHROME(false) +
    '<div class="sheet-body"><p class="eyebrow">'+["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]+'</p>'+
    '<h2 id="sheetTitle" style="font-size:clamp(23px,3.4vw,30px)">'+fmtDate(key)+'</h2>'+
    (items.length
      ? '<div class="events" style="margin-top:20px">'+items.map(dayRow).join("")+'</div>'
      : '<div class="empty" style="margin-top:20px">Nothing listed on this day.</div>')+
    '</div>');
  sheetBack = key;
}

function closeEvent(){
  const b = document.getElementById("sheet");
  if(b.hidden) return;
  b.classList.remove("open");
  lockScroll(false);
  sheetBack = null;
  setTimeout(() => { b.hidden = true; }, 340);
  lastFocus?.focus();
}

let heldY = 0;
function lockScroll(on){
  const body = document.body;
  if(on){
    heldY = window.scrollY;
    body.style.top = -heldY + "px";
    body.classList.add("locked");
  }else if(body.classList.contains("locked")){
    body.classList.remove("locked");
    body.style.top = "";
    window.scrollTo(0, heldY);
  }
}

/* keyboard focus stays inside the sheet while it is open */
addEventListener("keydown", e => {
  const b = document.getElementById("sheet");
  if(e.key !== "Tab" || b.hidden) return;
  const items = b.querySelectorAll("button, a[href]");
  if(!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

document.getElementById("sheet").addEventListener("click", e => { if(e.target.id === "sheet") closeEvent(); });
addEventListener("keydown", e => { if(e.key === "Escape" && !document.getElementById("sheet").hidden) closeEvent(); });
document.addEventListener("click", e => {
  if(e.target.closest("[data-day-back]") && sheetBack){ openDay(sheetBack); return; }
  const t = e.target.closest("[data-event]");
  if(t){
    if(!e.target.closest("#sheetInner")) sheetBack = null;   // opened from a page, not from a day
    openEvent(Number(t.dataset.event));
  }
});

/* ===================== CALENDAR ===================== */
let calCursor = null, calPick = null;

function calendarMap(){
  const map = {};
  const put = (k, v) => { (map[k] = map[k] || []).push(v); };
  state.reviews.forEach(r => { const d = parseDate(r.release_date); if(d) put(dayKey(d), { kind:"film", r }); });
  state.events.forEach(e => {
    const a = parseDate(e.date_start); if(!a) return;
    const b = parseDate(e.date_end) || a;
    for(let d = new Date(a); d <= b; d.setDate(d.getDate() + 1)) put(dayKey(d), { kind:"event", e });
  });
  return map;
}
function filmRow(r){
  const thumb = r.poster_url

    '</div></div><span class="chev">'+ICON.right+'</span></a>';
}
const dayRow = it => it.kind === "film" ? filmRow(it.r) : eventRow(it.e);

function pageCalendar(){
  const map = calendarMap(), now = new Date();
  if(!calCursor) calCursor = new Date(now.getFullYear(), now.getMonth(), 1);
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  const lead = new Date(y, m, 1).getDay(), len = new Date(y, m + 1, 0).getDate();
  const nowKey = dayKey(now);

  let cells = "", monthKeys = [];
  for(let i = 0; i < lead; i++) cells += '<div class="cal-cell empty"></div>';
  for(let d = 1; d <= len; d++){
    const key = y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    const items = map[key] || [];
    if(items.length) monthKeys.push(key);
    const marks = items.slice(0,3).map(i => '<i class="'+(i.kind === "event" ? "evt" : "")+'"></i>').join("");
    cells += '<button class="cal-cell'+(items.length ? " has" : " none")+(key === nowKey ? " today" : "")+
      (key === calPick ? " on" : "")+'"'+(items.length ? ' data-day="'+key+'"' : " disabled")+
      ' aria-label="'+d+" "+MONTH[m]+(items.length ? ", "+items.length+" listed" : ", nothing listed")+'">'+d+
      '<span class="marks">'+marks+'</span></button>';
  }

  const monthAll = monthKeys.flatMap(k => map[k]);
  const films = monthAll.filter(i => i.kind === "film").length;
  const evs = monthAll.filter(i => i.kind === "event").length;

  return '<div class="wrap rise"><section><p class="eyebrow">What is on when</p><h2>Calendar</h2>'+
    '<p class="sub" style="margin:10px 0 26px">Film releases and events, day by day. Tap a date to see what is on.</p>'+
    '<div class="cal-wrap"><div class="cal" id="calBox">'+
      '<div class="cal-top"><h3>'+MONTH[m]+' '+y+'</h3><div class="cal-nav">'+
        '<button data-cal="-1" aria-label="Previous month">'+ICON.left+'</button>'+
        '<button class="today" data-cal="today">Today</button>'+
        '<button data-cal="1" aria-label="Next month">'+ICON.right+'</button></div></div>'+
      '<div class="cal-dow">'+["S","M","T","W","T","F","S"].map(d => '<span>'+d+'</span>').join("")+'</div>'+
      '<div class="cal-grid'+(calSwipe === "back" ? " back" : "")+'">'+cells+'</div>'+
      '<div class="legend"><span><i></i>'+films+' film release'+(films === 1 ? "" : "s")+'</span>'+
      '<span><i class="evt"></i>'+evs+' event'+(evs === 1 ? "" : "s")+'</span></div>'+
    '</div>'+
    '<div class="cal-side"><div class="sec-head"><h2 style="font-size:22px">'+MONTH[m]+' at a glance</h2></div>'+
      (monthAll.length ? '<div class="events">'+monthAll.map(dayRow).join("")+'</div>'
        : '<div class="empty">Nothing listed for '+MONTH[m]+' yet.</div>')+
    '</div></div></section></div>';
}

/* ===================== ROUTER ===================== */
function render(keepScroll){
  const [, seg, param] = (location.hash.replace(/^#/,"") || "/").split("/");
  let html, key = "/" + (seg || "");
  if(seg === "reviews"){ location.replace("#/movies"); return; }   // old links keep working
  if(!seg) html = pageHome();
  else if(seg === "movies") html = pageMovies();
  else if(seg === "review") html = pageReview(param || "");
  else if(seg === "events") html = pageEvents();
  else if(seg === "calendar") html = pageCalendar();
  else if(seg === "about") html = pageAbout();
  else { html = notFound("That page doesn’t exist."); key = ""; }

  document.getElementById("app").innerHTML = html;
  document.querySelectorAll(".tabs a, .tabbar a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#"+key));
  document.title = "Kaydee.my — Indian Cinema Portal";
  if(!keepScroll) scrollTo(0,0);
  if(seg === "calendar") wireCalendar();
  if(seg === "movies"){ applyFilters(); wireSegments(applyFilters); document.getElementById("q").addEventListener("input", applyFilters); }
  initCarousels();
}

function shiftMonth(step){
  calSwipe = step < 0 ? "back" : "";
  calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + step, 1);
  calPick = null;
  render(true);
}

function wireCalendar(){
  document.querySelectorAll("[data-cal]").forEach(b => b.addEventListener("click", e => {
    e.preventDefault();
    const v = b.dataset.cal;
    if(v === "today"){
      const n = new Date();
      calSwipe = n < calCursor ? "back" : "";
      calCursor = new Date(n.getFullYear(), n.getMonth(), 1);
      calPick = dayKey(n);
      render(true);
    }else{
      shiftMonth(Number(v));
    }
  }));

  document.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => {
    calPick = b.dataset.day;
    render(true);
    openDay(calPick);
  }));

  // swipe the month across, the way a phone calendar does
  const box = document.getElementById("calBox");
  if(!box) return;
  let x0 = 0, y0 = 0, tracking = false;
  box.addEventListener("pointerdown", e => { tracking = true; x0 = e.clientX; y0 = e.clientY; });
  box.addEventListener("pointerup", e => {
    if(!tracking) return;
    tracking = false;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) shiftMonth(dx < 0 ? 1 : -1);
  });
  box.addEventListener("pointercancel", () => tracking = false);
}
